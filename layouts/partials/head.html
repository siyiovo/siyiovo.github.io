<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F7F9">
<meta name="page-type" content="software">
<meta name="site-kind" content="software">
<link rel="icon" type="image/jpeg" href="{{ "images/jinhua-deng.jpg" | relURL }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations }}
  <link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">
{{ end }}
<link rel="alternate" hreflang="x-default" href="{{ .Site.Home.Permalink }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "images/jinhua-deng.jpg" | absURL }}">
<link rel="stylesheet" href="{{ "css/portfolio.css" | relURL }}">
